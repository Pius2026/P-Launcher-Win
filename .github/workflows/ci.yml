name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET 9
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore P-Edu-Launcher.sln

      - name: Build
        run: dotnet build P-Edu-Launcher.sln -c Release --no-restore

      - name: Test
        run: dotnet test P-Edu-Launcher.sln -c Release --no-build --logger "console;verbosity=normal"
